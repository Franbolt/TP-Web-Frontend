<h2>Categorías</h2>

<a routerLink="/categorias/nueva" class="boton">Nueva categoría</a>


@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (cargando()) {
  <p>Cargando...</p>
}

@if (!cargando()) {
  <table>
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      @for (categoria of categorias(); track categoria.id) {
        <tr>
          <td>{{ categoria.id }}</td>
          <td>{{ categoria.nombre }}</td>
          <td>
            <a [routerLink]="['/categorias', categoria.id, 'editar']">Editar</a>
            <button type="button" (click)="borrar(categoria.id)">Borrar</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="3">No hay categorías todavía.</td></tr>
      }
    </tbody>
  </table>
}
