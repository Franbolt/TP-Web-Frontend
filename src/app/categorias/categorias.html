<h2>Categorías</h2>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (cargando()) {
  <p>Cargando...</p>
}

@if (!cargando() && !error()) {
  <table>
    <thead>
      <tr><th>ID</th><th>Nombre</th></tr>
    </thead>
    <tbody>
      @for (categoria of categorias(); track categoria.id) {
        <tr>
          <td>{{ categoria.id }}</td>
          <td>{{ categoria.nombre }}</td>
        </tr>
      } @empty {
        <tr><td colspan="2">No hay categorías todavía.</td></tr>
      }
    </tbody>
  </table>
}
